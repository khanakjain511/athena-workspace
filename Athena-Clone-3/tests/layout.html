<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Athena viewport validation</title></head>
  <body style="margin:0;background:#e7e9ee;font:13px Arial">
    <p id="viewport-label" style="margin:12px 16px"></p>
    <iframe title="Assessment viewport" style="display:block;border:1px solid #d5dae4;margin:16px;background:white" allow="camera;fullscreen"></iframe>
    <script type="module">
      const params = new URLSearchParams(location.search)
      const width = Math.max(320, Math.min(1600, Number(params.get('width')) || 1100))
      const height = Math.max(320, Math.min(1800, Number(params.get('height')) || 540))
      const frame = document.querySelector('iframe')
      frame.style.width = `${width}px`
      frame.style.height = `${height}px`
      frame.src = params.get('motion') === 'reduced' ? '/tests/ui-harness.html?motion=reduced' : '/'
      document.getElementById('viewport-label').textContent = `Viewport validation: ${width} × ${height}`
    </script>
  </body>
</html>
